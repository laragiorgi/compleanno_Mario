<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MARIO #30 - GRAND PRIX</title>
    <!-- Font Racing & Pixel -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --ferrari-red: #E3000B;
            --lego-yellow: #FFD500;
            --dark-asphalt: #111116;
            --neon-green: #00FF66;
            --pure-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-asphalt);
            background-image: 
                radial-gradient(circle, rgba(255, 213, 0, 0.15) 20%, transparent 20%),
                linear-gradient(45deg, #181820 25%, transparent 25%, transparent 75%, #181820 75%, #181820),
                linear-gradient(45deg, #181820 25%, transparent 25%, transparent 75%, #181820 75%, #181820);
            background-size: 20px 20px, 40px 40px, 40px 40px;
            background-position: 0 0, 0 0, 20px 20px;
            font-family: 'Orbitron', -apple-system, sans-serif;
            color: var(--pure-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 15px;
            cursor: pointer;
        }

        /* Container Card Responsive */
        .card-container {
            width: 100%;
            max-width: 800px;
            background: linear-gradient(135deg, #1f1f28 0%, #111116 100%);
            border: 4px solid var(--ferrari-red);
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(227, 0, 11, 0.7), inset 0 0 15px rgba(255, 213, 0, 0.2);
            position: relative;
            padding: 40px 20px 30px 20px;
            text-align: center;
        }

        /* Pattern Bandiera a Scacchi */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 12px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0, #fff 12px,
                #000 12px, #000 24px
            );
            border-radius: 16px 16px 0 0;
        }

        .badge-f1 {
            display: inline-block;
            background: var(--lego-yellow);
            color: var(--dark-asphalt);
            font-family: 'Teko', sans-serif;
            font-size: clamp(1.4rem, 5vw, 1.8rem);
            letter-spacing: 2px;
            padding: 2px 20px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #b39500;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(1.8rem, 7vw, 3.2rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--pure-white);
            text-shadow: 2px 2px 0px var(--ferrari-red);
            margin-bottom: 5px;
            line-height: 1.1;
        }

        .age-badge {
            font-size: clamp(4.5rem, 18vw, 6.5rem);
            font-family: 'Teko', sans-serif;
            line-height: 0.9;
            color: var(--lego-yellow);
            text-shadow: 3px 3px 0px var(--ferrari-red), 6px 6px 0px #000;
            display: inline-block;
            transform: skew(-8deg);
            margin: 10px 0;
        }

        /* Telemetria Racing Grid Mobile-First */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .telemetry-grid {
                grid-template-columns: 1fr;
            }
        }

        .telemetry-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 213, 0, 0.3);
            border-left: 4px solid var(--ferrari-red);
            border-radius: 10px;
            padding: 12px 15px;
            text-align: left;
        }

        .telemetry-card .label {
            font-size: 0.7rem;
            color: #888;
            letter-spacing: 1px;
        }

        .telemetry-card .value {
            font-size: clamp(1.1rem, 4vw, 1.4rem);
            color: var(--neon-green);
            font-weight: 900;
            margin-top: 3px;
        }

        .tap-hint {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="badge-f1">🏎️ FORMULA 1 GRAND PRIX 🏎️</div>
        
        <h1>HAPPY BIRTHDAY MARIO</h1>
        
        <div>
            <span class="age-badge">30 LAPS</span>
        </div>

        <p style="color: #aaa; font-size: clamp(0.9rem, 3.5vw, 1.1rem); letter-spacing: 1px;">
            FASTEST LAP RECORDED • P1 ON THE GRID
        </p>

        <!-- Griglia Telemetria -->
        <div class="telemetry-grid">
            <div class="telemetry-card">
                <div class="label">STATUS PILOTA</div>
                <div class="value">P1 LEGENDARY</div>
            </div>
            <div class="telemetry-card">
                <div class="label">GIRI COMPLETATI</div>
                <div class="value">30 GIRI</div>
            </div>
            <div class="telemetry-card">
                <div class="label">TEMPO SULLA PISTA</div>
                <div class="value">10.957 GIORNI</div>
            </div>
            <div class="telemetry-card">
                <div class="label">VELOCITÀ MAX</div>
                <div class="value">350+ KM/H</div>
            </div>
        </div>

        <div class="tap-hint">⚡ TCCA LO SCHERMO PER ACCELERARE ⚡</div>
    </div>

    <script>
        function playEngineSound() {
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.4);
                osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.8);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}
        }

        function startAutoExplosions() {
            playEngineSound();

            confetti({
                particleCount: 150,
                spread: 90,
                origin: { y: 0.6 },
                colors: ['#E3000B', '#FFD500', '#00FF66', '#FFFFFF']
            });

            var duration = 12 * 1000;
            var animationEnd = Date.now() + duration;

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 50,
                    origin: { x: 0, y: 0.7 },
                    colors: ['#E3000B', '#FFD500']
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 50,
                    origin: { x: 1, y: 0.7 },
                    colors: ['#00FF66', '#FFFFFF']
                });
            }, 280);
        }

        window.onload = function() {
            startAutoExplosions();
        };

        document.body.addEventListener('touchstart', function() {
            startAutoExplosions();
        });
        
        document.body.addEventListener('click', function() {
            startAutoExplosions();
        });
    </script>
</body>
</html>
