<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARIO #30 - GRAND PRIX</title>
    <!-- Font Racing & Pixel -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Teko:wght@700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --ferrari-red: #E3000B;
            --lego-yellow: #FFD500;
            --dark-asphalt: #111116;
            --neon-green: #00FF66;
            --pure-white: #FFFFFF;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--dark-asphalt);
            background-image: 
                radial-gradient(circle, rgba(255, 213, 0, 0.15) 20%, transparent 20%),
                linear-gradient(45deg, #181820 25%, transparent 25%, transparent 75%, #181820 75%, #181820),
                linear-gradient(45deg, #181820 25%, transparent 25%, transparent 75%, #181820 75%, #181820);
            background-size: 30px 30px, 60px 60px, 60px 60px;
            background-position: 0 0, 0 0, 30px 30px;
            font-family: 'Orbitron', sans-serif;
            color: var(--pure-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
            cursor: pointer;
        }

        /* Container Card */
        .card-container {
            width: 100%;
            max-width: 850px;
            background: linear-gradient(135deg, #1f1f28 0%, #111116 100%);
            border: 6px solid var(--ferrari-red);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(227, 0, 11, 0.7), inset 0 0 20px rgba(255, 213, 0, 0.3);
            position: relative;
            padding: 50px 30px;
            text-align: center;
        }

        /* Pattern Bandiera a Scacchi */
        .card-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 14px;
            background: repeating-linear-gradient(
                90deg,
                #fff 0, #fff 15px,
                #000 15px, #000 30px
            );
            border-radius: 12px 12px 0 0;
        }

        .badge-f1 {
            display: inline-block;
            background: var(--lego-yellow);
            color: var(--dark-asphalt);
            font-family: 'Teko', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            padding: 4px 25px;
            border-radius: 6px;
            font-weight: 700;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #b39500;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 3.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--pure-white);
            text-shadow: 3px 3px 0px var(--ferrari-red);
            margin-bottom: 10px;
        }

        .age-badge {
            font-size: 6.5rem;
            font-family: 'Teko', sans-serif;
            line-height: 0.9;
            color: var(--lego-yellow);
            text-shadow: 4px 4px 0px var(--ferrari-red), 8px 8px 0px #000;
            display: inline-block;
            transform: skew(-10deg);
            margin: 15px 0;
        }

        /* Telemetria Racing Grid */
        .telemetry-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 35px;
        }

        .telemetry-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 213, 0, 0.3);
            border-left: 5px solid var(--ferrari-red);
            border-radius: 10px;
            padding: 15px;
            text-align: left;
        }

        .telemetry-card .label {
            font-size: 0.75rem;
            color: #888;
            letter-spacing: 1px;
        }

        .telemetry-card .value {
            font-size: 1.4rem;
            color: var(--neon-green);
            font-weight: 900;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="badge-f1">🏎️ LEGO F1 GRAND PRIX 🏎️</div>
        
        <h1>HAPPY BIRTHDAY MARIO</h1>
        
        <div>
            <span class="age-badge">30 LAPS</span>
        </div>

        <p style="color: #aaa; font-size: 1.2rem; letter-spacing: 1px; margin-top: 10px;">
            FASTEST LAP RECORDED • P1 ON THE GRID
        </p>

        <!-- Griglia Telemetria -->
        <div class="telemetry-grid">
            <div class="telemetry-card">
                <div class="label">STATUS PILOTA</div>
                <div class="value">P1 LEGENDARY</div>
            </div>
            <div class="telemetry-card">
                <div class="label">GIRI COMPLETATI</div>
                <div class="value">30 GIRI</div>
            </div>
            <div class="telemetry-card">
                <div class="label">MATTONCINI F1</div>
                <div class="value">UNLIMITED 🧱</div>
            </div>
            <div class="telemetry-card">
                <div class="label">VELOCITÀ MAX</div>
                <div class="value">350+ KM/H</div>
            </div>
        </div>
    </div>

    <script>
        // Suono Rombo di Motore Sintetizzato
        function playEngineSound() {
            try {
                var audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                var osc = audioCtx.createOscillator();
                var gain = audioCtx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(100, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(700, audioCtx.currentTime + 0.4);
                osc.frequency.exponentialRampToValueAtTime(90, audioCtx.currentTime + 0.8);
                
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            } catch(e) {}
        }

        // Esplosioni di Coriandoli Continue in Automatico
        function startAutoExplosions() {
            playEngineSound();

            // Esplosione iniziale violenta
            confetti({
                particleCount: 180,
                spread: 100,
                origin: { y: 0.6 },
                colors: ['#E3000B', '#FFD500', '#00FF66', '#FFFFFF']
            });

            // Esplosioni continue laterali automatiche a pioggia
            var duration = 15 * 1000; // Dura 15 secondi all'apertura
            var animationEnd = Date.now() + duration;

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                confetti({
                    particleCount: 8,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0, y: 0.7 },
                    colors: ['#E3000B', '#FFD500']
                });
                confetti({
                    particleCount: 8,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1, y: 0.7 },
                    colors: ['#00FF66', '#FFFFFF']
                });
            }, 250);
        }

        // Avvio automatico all'apertura della pagina
        window.onload = function() {
            startAutoExplosions();
        };

        // Se l'utente clicca in qualsiasi punto della schermata, riparte l'esplosione audio/visiva
        document.body.addEventListener('click', function() {
            startAutoExplosions();
        });
    </script>
</body>
</html>
